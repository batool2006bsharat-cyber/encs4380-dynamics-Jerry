        }

        /* ---------- Predict, then check quiz ---------- */
        .quizTop { display: flex; justify-content: space-between; color: #8a6a80; font-size: 0.9rem; }
        .quizQ { font-weight: bold; margin: 8px 0 12px; }
        .quizOpts { display: grid; gap: 8px; margin-bottom: 4px; }

<body>

<div class="container">

    <nav class="crumbs"><a href="index.html">Dynamics Toolkit</a> / Module 1</nav>

    <h1>Dynamic Characteristics Toolkit</h1>

    <h2>Module 1: First-Order Time Response</h2>

    <p>
        Model:
        τdy/dt + y = Kx
    </p>

    <div class="control">

        <label for="kSlider">Gain K:</label>

        <input
            type="range"
            id="kSlider"
            min="1"
            max="10"
            value="1"
            step="1">

        <span class="value" id="kValue">1</span>

    </div>


    <div class="control">

        <label for="tauSlider">Time Constant τ:</label>

        <input
            type="range"
            id="tauSlider"
            min="1"
            max="10"
            value="2"
            step="1">

        <span class="value" id="tauValue">2</span> s

    </div>


    <div class="control">

        <label for="inputType">Input Type:</label>

        <select id="inputType">

            <option value="step">Step</option>

            <option value="ramp">Ramp</option>

        </select>

    </div>


    <!-- Predict then check: commit to an answer, then run the experiment -->

    <div class="predictBox">

        <h3>Predict, then check</h3>

        <div class="quizTop">
            <span id="quizCount"></span>
            <span id="quizScore"></span>
        </div>

        <p class="quizQ" id="quizQuestion"></p>

        <div class="quizOpts" id="quizOptions"></div>

        <div class="quizButtons">
            <button id="quizLock" disabled>Lock in my guess</button>
            <button id="quizRun" class="secondary" hidden>Run the experiment</button>
            <button id="quizNext" class="secondary" hidden>Next question</button>
        </div>

        <p id="quizExplain" aria-live="polite"></p>

    </div>


    <!-- Main response plot -->

    <div id="responsePlot"></div>


    <!-- Ramp information -->

    <div
        id="rampInfo"
        class="infoBox">
    </div>


    <!-- Error fraction -->

    <h3 id="errorTitle">
        Error-Fraction Plot
    </h3>

    <div id="errorPlot"></div>


    <!-- Validation -->

    <div class="validationBox">

        <h3>Validation Checks</h3>

        <div class="tableWrap">
        <table>

            <tr>
                <th>Test</th>
                <th>Expected Value</th>
                <th>Calculated Value</th>
                <th>Status</th>
            </tr>

            <tr>

                <td>y(τ) / K</td>

                <td>0.632</td>

                <td id="validationTau"></td>

                <td id="statusTau"></td>

            </tr>

            <tr>

                <td>y(3τ) / K</td>

                <td>0.950</td>

                <td id="validation3Tau"></td>

                <td id="status3Tau"></td>

            </tr>

        </table>
        </div>

    </div>

</div>


<script>

    const kSlider =
        document.getElementById("kSlider");

    const tauSlider =
        document.getElementById("tauSlider");

    const inputType =
        document.getElementById("inputType");

    const kValue =
        document.getElementById("kValue");

    const tauValue =
        document.getElementById("tauValue");


    /* Colors and plot style shared with Module 2 */

    const ROSE = "#e2548f";
    const LILAC = "#8f6fdc";
    const MINT = "#4fb89a";

    function styleLayout(layout) {
        layout.paper_bgcolor = "rgba(0,0,0,0)";
        layout.plot_bgcolor = "#fffafc";
        layout.font = { color: "#4a2740" };
        layout.legend = { orientation: "h", y: -0.25 };
        layout.margin = { t: 50, r: 20, b: 60, l: 60 };
        layout.xaxis.gridcolor = "#f5dce8";
        layout.yaxis.gridcolor = "#f5dce8";
        return layout;
    }


    function drawPlot() {

        const K =
            parseFloat(kSlider.value);

        const tau =
            parseFloat(tauSlider.value);


        let t = [];

        let y = [];

        let input = [];

        let errorFraction = [];


        /*
            Generate points from
            t = 0 to t = 10τ.

            This guarantees that
            τ and 3τ are visible.
        */

        const maxTime = 10 * tau;

        const numberOfPoints = 300;


        for (
            let i = 0;
            i <= numberOfPoints;
            i++
        ) {

            const time =
                (i / numberOfPoints) * maxTime;

            t.push(time);


            if (
                inputType.value === "step"
            ) {

                /*
                    Step response:

                    y(t) =
                    K(1 - e^(-t/τ))

                    Unit step amplitude A = 1
                */

                const output =
                    K *
                    (
                        1 -
                        Math.exp(-time / tau)
                    );

                y.push(output);

                input.push(K);


                /*
                    Error fraction:

                    (K - y) / K
                    = e^(-t/τ)
                */

                const error =
                    Math.exp(-time / tau);

                errorFraction.push(error);

            }

            else {

                /*
                    Ramp response:

                    x(t) = t

                    y(t) =
                    K[
                        t - τ
                        + τe^(-t/τ)
                    ]
                */

                const output =
                    K *
                    (
                        time
                        - tau
                        + tau *
                        Math.exp(-time / tau)
                    );

                y.push(output);

                input.push(K * time);

            }
        }


        /*
            OUTPUT RESPONSE
        */

        const outputTrace = {

            x: t,

            y: y,

            mode: "lines",

            name: "Output y(t)",

            line: { color: ROSE, width: 3 }

        };


        let traces = [];


        /*
            STEP
        */

        if (
            inputType.value === "step"
        ) {

            const inputTrace = {

                x: t,

                y: input,

                mode: "lines",

                name: "Final Value KA",

                line: { color: LILAC, width: 2, dash: "dash" }

            };


            /*
                Important points
            */

            const yTau =
                K *
                (
                    1 -
                    Math.exp(-1)
                );


            const y3Tau =
                K *
                (
                    1 -
                    Math.exp(-3)
                );


            const markerTrace = {

                x: [
                    tau,
                    3 * tau
                ],

                y: [
                    yTau,
                    y3Tau
                ],

                mode:
                    "markers+text",

                name:
                    "Important Points",

                text: [

                    "63.2% at t = τ",

                    "95% at t = 3τ"

                ],

                textposition:
                    "top center",

                marker: {
                    size: 11,
                    color: MINT
                }

            };


            traces = [

                inputTrace,

                outputTrace,

                markerTrace

            ];


            document
                .getElementById(
                    "rampInfo"
                )
                .innerHTML = "";


            /*
                Hide the empty ramp box
                in step mode.
            */

            document
                .getElementById(
                    "rampInfo"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "errorTitle"
                )
                .style.display =
                "block";


            document
                .getElementById(
                    "errorPlot"
                )
                .style.display =
                "block";


            /*
                Error-fraction plot
            */

            const errorTrace = {

                x: t,

                y: errorFraction,

                mode: "lines",

                name:
                    "Error Fraction",

                line: { color: LILAC, width: 3 }

            };


            const errorLayout = {

                title:
                    "Error Fraction vs Time",

                xaxis: {

                    title:
                        "Time (s)"

                },

                yaxis: {

                    title:
                        "(KA - y) / KA",

                    type: "log"

                },

                annotations: [

                    {

                        x:
                            5 * tau,

                        /*
                            On a log axis Plotly expects
                            log10 of the position.
                        */
                        y:
                            Math.log10(Math.exp(-5)),

                        yshift: 14,

                        text:
                            "Slope = -1/τ = " +
                            (
                                -1 / tau
                            ).toFixed(3),

                        showarrow:
                            false

                    }

                ]

            };


            Plotly.newPlot(

                "errorPlot",

                [errorTrace],

                styleLayout(errorLayout),

                { responsive: true }

            );

        }


        /*
            RAMP
        */

        else {

            const inputTrace = {

                x: t,

                y: input,

                mode: "lines",

                name:
                    "Input Ramp Kx(t)",

                line: { color: LILAC, width: 2 }

            };


            traces = [

                inputTrace,

                outputTrace

            ];


            /*
                Ramp lag and
                steady-state error
            */

            const steadyStateError =
                K * tau;


            document
                .getElementById(
                    "rampInfo"
                )
                .innerHTML =

                "<b>Ramp Lag:</b> τ = "
                + tau
                + " s"

                + "<br><br>"

                + "<b>Steady-State Error:</b> "
                + "Kτ = "
                + steadyStateError
                    .toFixed(2);


            document
                .getElementById(
                    "rampInfo"
                )
                .style.display =
                "block";


            /*
                Hide error plot
                for ramp.
            */

            document
                .getElementById(
                    "errorTitle"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "errorPlot"
                )
                .style.display =
                "none";

        }


        /*
            Main plot
        */

        const layout = {

            title:

                inputType.value === "step"

                ? "First-Order Step Response"

                : "First-Order Ramp Response",


            xaxis: {

                title:
                    "Time (s)"

            },


            yaxis: {

                title:
                    "Amplitude"

            }

        };


        Plotly.newPlot(

            "responsePlot",

            traces,

            styleLayout(layout),

            { responsive: true }

        );


        /*
            Validation
        */

        runValidation(
            K,
            tau
        );

    }


    function runValidation(
        K,
        tau
    ) {

        /*
            Expected:
            y(τ) = 0.632 KA
        */

        const yTau =
            K *
            (
                1 -
                Math.exp(-1)
            );


        const ratioTau =
            yTau / K;


        /*
            Expected:
            y(3τ) = 0.95 KA
        */

        const y3Tau =
            K *
            (
                1 -
                Math.exp(-3)
            );


        const ratio3Tau =
            y3Tau / K;


        document
            .getElementById(
                "validationTau"
            )
            .textContent =
            ratioTau.toFixed(3);


        document
            .getElementById(
                "validation3Tau"
            )
            .textContent =
            ratio3Tau.toFixed(3);


        /*
            PASS / FAIL
        */

        const statusTauPass =
            Math.abs(
                ratioTau - 0.632
            ) < 0.005;

        const statusTauCell =
            document.getElementById("statusTau");

        statusTauCell.textContent =
            statusTauPass ? "PASS ✓" : "FAIL ✗";

        statusTauCell.className =
            statusTauPass ? "pass" : "fail";


        const status3TauPass =
            Math.abs(
                ratio3Tau - 0.95
            ) < 0.005;

        const status3TauCell =
            document.getElementById("status3Tau");

        status3TauCell.textContent =
            status3TauPass ? "PASS ✓" : "FAIL ✗";

        status3TauCell.className =
            status3TauPass ? "pass" : "fail";

    }


    /*
        Predict then check

        Each question: the user commits to an answer,
        then "Run the experiment" moves the sliders
        on their own so the plot shows the result.
    */

    const quizQuestions = [
        {
            question: "Step input, K = 1. If τ doubles from 2 s to 4 s, the time to reach 63.2% of the final value will…",
            options: ["halve", "stay the same", "double"],
            correct: 2,
            explain: "y(τ) = K(1 − e⁻¹) = 0.632K, so the 63.2% point is always at t = τ. Doubling τ doubles that time (2 s → 4 s). The final value does not change.",
            start: { K: 1, tau: 2, type: "step" },
            end: { tau: 4 }
        },
        {
            question: "Step input, τ = 2 s. If K goes from 1 to 3, the time to reach 63.2% of the final value will…",
            options: ["get shorter", "stay the same", "get longer"],
            correct: 1,
            explain: "K only scales the output: the final value triples (1 → 3), but y(t)/K = 1 − e^(−t/τ) does not depend on K. The 63.2% point stays at t = τ = 2 s.",
            start: { K: 1, tau: 2, type: "step" },
            end: { K: 3 }
        },
        {
            question: "Ramp input x(t) = t, K = 1, τ = 3 s. After the start-up transient, the output follows the input…",
            options: ["with no delay: it catches up", "with a constant delay of 3 s", "with a delay that keeps growing"],
            correct: 1,
            explain: "For a ramp, y(t) = K(t − τ + τe^(−t/τ)). Once the exponential dies out, y(t) = K(t − τ): the same line shifted right by τ = 3 s. The steady-state error is Kτ = 3.",
            start: { K: 1, tau: 1, type: "ramp" },
            end: { tau: 3 }
